name: Build and Push to c8n.io

on:
  push:
    branches:
      - dev # Triggers the workflow on pushes to the main branch

jobs:
  build-and-push:
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - name: Check Docker login to c8n.io (debug)
      run: |
        set -e
        echo "Attempting docker login to c8n.io"
        echo "${{ secrets.C8N_PASSWORD }}" | docker login c8n.io -u "${{ secrets.C8N_USERNAME }}" --password-stdin
        echo "Login succeeded, listing registry v2 endpoint status..."
        curl -I -s https://c8n.io/v2/ || true
      # Step 1: Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for optimization
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to c8n.io registry
      - name: Log in to c8n.io
        uses: docker/login-action@v3
        with:
          registry: c8n.io
          username: ${{ secrets.C8N_USERNAME }}
          password: ${{ secrets.C8N_PASSWORD }}

      # Step 4: Build the image and push to c8n.io
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-project-name' and 'your-app-name' accordingly
          tags: |
            c8n.io/dtrunghieu/grafana:v1

